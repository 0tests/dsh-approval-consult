# 审批咨询台（dsh-approval-consult 本地 bundle patch）
#
# 一行宿主插件 + 一份 client/ 声明（见 package.json 的 dsh.client）。
# 宿主侧注册 /dsh-approval-consult/* 路由并挂三个只读/旁路监听器：
#   - llm/stream        捕获 auto-review 的审查请求与主对话请求（仅观察，不改写）
#   - tools/pre-execute 记录待审批调用的参数（仅观察，返回 next()）
#   - approval/request  在浏览器应答者之前登记 pending（prepend，最终返回 next() 的结果）
# 客户端侧提供「审批咨询台」悬浮胶囊与侧边面板，通过同源 HTTP 与宿主通信。
- insert:
    - id: approval-consult
      name: 'dsh-approval-consult'
      config:
        # 宿主实现文件变化后自动热重载。默认关闭；本地开发时用 profile patch 覆盖成 true。
        devWatch: false
        # 单条提问长度上限（字符）。
        maxQuestionChars: 2000
        # 每个待审批项最多并发回答数。
        maxConcurrentJobs: 3
        # 执行 AI 侧回答的 maxTokens（代码内还会按 >=3000 兜底，避免思考模型没有正文）。
        executorMaxTokens: 4000
        # 审查 AI 侧回答的 maxTokens（代码内按 >=1800 兜底）。
        reviewerMaxTokens: 2400
        # 线程保留时间（毫秒），超时后从宿主内存清理。
        threadTtlMs: 7200000
        # 用户数据目录（常用问题等）。不填 = 自动：dataDir/DSH_APPROVAL_CONSULT_DATA >
        # $DSH_PROFILE_DIR/data/approval-consult > --profile 推导 > ~/.dsh-approval-consult。
        # dataDir: 'D:/dsh-data/approval-consult'
        # 开发/排障接口（/debug/inspect、selftest、events、inject、features、synthetic-approval）。
        # 默认关闭；它们能注入会话内容/切换能力开关，生产环境不要打开。
        devTools: false
        # 自动拒绝倒计时（可选集成 dsh-approval-timeout）的暂停策略：
        #   on-send 仅当用户真正开始提问时暂停（默认；打开面板不会动倒计时）
        #   on-open 打开面板即暂停
        #   off     完全不动别人的倒计时，只保留面板里的手动「暂停倒计时」按钮
        # 说明：该插件的 /cancel 是全局的，会同时取消其它待审批项的倒计时；
        # 自动路径（on-send/on-open）探测到还有别的待审批项时会拒绝自动暂停并提示用户。
        timeoutAutoPause: 'on-send'
        # 审查 AI 能力：auto = 按官方自动审查插件是否安装/启用自动检测（默认；
        # 没装时整个咨询台只保留「执行 AI」通道）；on = 强制显示；off = 强制只问执行 AI。
        reviewerMode: 'auto'
