name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: >-
      github.repository == '0tests/dsh-approval-consult' &&
      (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify package name and release tag
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');

          assert.equal(pkg.name, 'dsh-approval-consult');
          if (process.env.GITHUB_EVENT_NAME === 'release') {
            assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
            assert.equal(
              process.env.GITHUB_REF,
              'refs/tags/v' + pkg.version,
              'Release tag must match package.json version (vX.Y.Z)'
            );
          }
          NODE
      - name: Check syntax and run tests
        run: |
          npm run check
          npm test
      - name: Pack npm tarball
        run: |
          archive=$(npm pack --ignore-scripts --loglevel=error --pack-destination "$RUNNER_TEMP")
          tar -tzf "$RUNNER_TEMP/$archive"
          mv -- "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/package.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-publish
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish to npm with OIDC
        run: npm publish "$RUNNER_TEMP/npm-publish/package.tgz" --access public --ignore-scripts
